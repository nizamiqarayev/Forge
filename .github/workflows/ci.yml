name: CI

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  packages: write      

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build Forge CLI
        run: go build -o bin/forge ./cmd/forge

      - name: Build hello-api image
        run: docker build --file examples/hello-api/Dockerfile --tag hello-api:ci .

      - name: Smoke-test hello-api image
        run: |
          docker run --detach \
            --name hello-api-ci \
            --publish 127.0.0.1:18080:8080 \
            hello-api:ci

          trap 'docker rm --force hello-api-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done

          docker logs hello-api-ci
          exit 1

      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin     
  
      - name: Publish multi-platform hello-api image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/forge-hello-api:${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file examples/hello-api/Dockerfile \
            --tag "$IMAGE" \
            --push \
            .

          echo "Published $IMAGE"