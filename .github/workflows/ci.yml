name: CI

on:
  push:
    branches:
      - main
  pull_request:
      

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build Forge CLI
        run: go build -o bin/forge ./cmd/forge

      - name: Build hello-api image
        run: docker build --file examples/hello-api/Dockerfile --tag hello-api:ci .